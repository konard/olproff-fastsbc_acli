syntax = "proto3";

package fastsbc.acli.v1;

option go_package = "github.com/olproff/fastsbc_acli/gen/go/acli/v1;acliv1";

service acli_service {
  rpc execute_command(command_request) returns (command_response);
  rpc commit_candidate(commit_request) returns (command_response);
  rpc show_state(show_request) returns (show_response);
}

message command_request {
  string trace_id = 1;
  string username = 2;
  string role = 3;
  string raw_command = 4;
  repeated string argv = 5;
  map<string, string> candidate_changes = 6;
}

message commit_request {
  string trace_id = 1;
  string username = 2;
  string role = 3;
  string raw_command = 4;
  map<string, string> candidate_changes = 5;
}

message show_request {
  string trace_id = 1;
  string username = 2;
  string role = 3;
  string raw_command = 4;
  string topic = 5;
}

message command_response {
  string trace_id = 1;
  bool accepted = 2;
  string output = 3;
  string error_code = 4;
  string error_message = 5;
}

message show_response {
  string trace_id = 1;
  string output = 2;
  string error_code = 3;
  string error_message = 4;
}
